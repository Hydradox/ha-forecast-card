# GENERATED by hand-run script: one fixed-condition weather entity per condition (gallery view).
# Edit freely; the forecast shape mirrors weather.dev_weather in configuration.yaml.
template:
  - weather:
      - name: Gallery Sunny
        unique_id: dev_gallery_sunny
        condition: sunny
        temperature: 27.8
        temperature_unit: °C
        humidity: 65
        wind_speed: 12
        wind_speed_unit: km/h
        wind_bearing: 112
        uv_index: 6.5
        precipitation_unit: mm
        forecast_hourly: >-
          {% set start = now().replace(minute=0, second=0, microsecond=0) %}
          {% set ns = namespace(items=[]) %}
          {% for i in range(0, 24) %}
            {% set when = start + timedelta(hours=i) %}
            {% set ns.items = ns.items + [{
              "datetime": when.isoformat(),
              "temperature": (27.8 + 6 * cos((when.hour - 15) * 0.2618)) | round(1),
              "condition": "sunny",
              "precipitation": 0,
              "precipitation_probability": 10,
              "is_daytime": 7 <= when.hour <= 20
            }] %}
          {% endfor %}
          {{ ns.items }}
        forecast_daily: >-
          {% set start = now().replace(hour=12, minute=0, second=0, microsecond=0) %}
          {% set ns = namespace(items=[]) %}
          {% for i in range(0, 7) %}
            {% set ns.items = ns.items + [{
              "datetime": (start + timedelta(days=i)).isoformat(),
              "temperature": (27.8 + 3 * cos(i * 0.9)) | round(1),
              "templow": (27.8 - 7 + 3 * cos(i * 0.9)) | round(1),
              "condition": "sunny",
              "precipitation": 0,
              "precipitation_probability": 5
            }] %}
          {% endfor %}
          {{ ns.items }}
