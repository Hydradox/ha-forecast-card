# Throwaway Home Assistant used to test the card. Not for production use.
homeassistant:
  name: Forecast dev
  latitude: 40.4168
  longitude: -3.7038
  elevation: 650
  unit_system: metric        # switch to us_customary in Settings → General to test °F / mph / in
  time_zone: Europe/Madrid
  currency: EUR
  country: ES

frontend:
  themes: !include_dir_merge_named themes

# Minimal set of integrations (default_config pulls in far more than needed).
config:
history:
logbook:
recorder:
onboarding:
sun:

# Controls to tweak the fake weather live from the dashboard.
input_select:
  dev_condition:
    name: Condition
    icon: mdi:weather-partly-cloudy
    initial: partlycloudy
    options:
      - clear-night
      - cloudy
      - exceptional
      - fog
      - hail
      - lightning
      - lightning-rainy
      - partlycloudy
      - pouring
      - rainy
      - snowy
      - snowy-rainy
      - sunny
      - windy
      - windy-variant

input_number:
  dev_temperature:
    name: Temperature
    min: -30
    max: 50
    step: 0.5
    initial: 18
    unit_of_measurement: °C
  dev_humidity:
    name: Humidity
    min: 0
    max: 100
    step: 1
    initial: 67
    unit_of_measurement: "%"
  dev_wind:
    name: Wind speed
    min: 0
    max: 150
    step: 1
    initial: 10
    unit_of_measurement: km/h
  dev_wind_bearing:
    name: Wind bearing
    min: 0
    max: 359
    step: 1
    initial: 112
    unit_of_measurement: °
  dev_uv:
    name: UV index
    min: 0
    max: 14
    step: 0.1
    initial: 1.7
  dev_rain:
    name: Rain (mm per rainy slot)
    min: 0
    max: 20
    step: 0.1
    initial: 0.8
    unit_of_measurement: mm

template:
  # Full-featured weather: hourly + daily forecasts driven by the helpers above.
  - weather:
      - name: Dev weather
        unique_id: dev_weather
        condition: "{{ states('input_select.dev_condition') }}"
        temperature: "{{ states('input_number.dev_temperature') | float(18) }}"
        temperature_unit: °C
        humidity: "{{ states('input_number.dev_humidity') | float(60) }}"
        wind_speed: "{{ states('input_number.dev_wind') | float(0) }}"
        wind_speed_unit: km/h
        wind_bearing: "{{ states('input_number.dev_wind_bearing') | float(0) }}"
        uv_index: "{{ states('input_number.dev_uv') | float(0) }}"
        precipitation_unit: mm
        forecast_hourly: >-
          {% set base = states('input_number.dev_temperature') | float(18) %}
          {% set cond = states('input_select.dev_condition') %}
          {% set rain = states('input_number.dev_rain') | float(0) %}
          {% set start = now().replace(minute=0, second=0, microsecond=0) %}
          {% set ns = namespace(items=[]) %}
          {% for i in range(0, 24) %}
            {% set when = start + timedelta(hours=i) %}
            {% set wet = i % 6 in [2, 3] %}
            {% set ns.items = ns.items + [{
              "datetime": when.isoformat(),
              "temperature": (base + 5 * cos((when.hour - 15) * 0.2618)) | round(1),
              "condition": 'rainy' if wet else cond,
              "precipitation": rain if wet else 0,
              "precipitation_probability": 70 if wet else 10,
              "is_daytime": 7 <= when.hour <= 20
            }] %}
          {% endfor %}
          {{ ns.items }}
        forecast_daily: >-
          {% set base = states('input_number.dev_temperature') | float(18) %}
          {% set cond = states('input_select.dev_condition') %}
          {% set rain = states('input_number.dev_rain') | float(0) %}
          {% set start = now().replace(hour=12, minute=0, second=0, microsecond=0) %}
          {% set ns = namespace(items=[]) %}
          {% for i in range(0, 10) %}
            {% set wet = i in [0, 2, 5] %}
            {% set ns.items = ns.items + [{
              "datetime": (start + timedelta(days=i)).isoformat(),
              "temperature": (base + 2 * cos(i * 0.9)) | round(1),
              "templow": (base - 7 + 2 * cos(i * 0.9)) | round(1),
              "condition": 'rainy' if wet else cond,
              "precipitation": (rain * (1 + i % 3)) if wet else 0,
              "precipitation_probability": 80 if wet else 5
            }] %}
          {% endfor %}
          {{ ns.items }}

  # Daily forecast only, no wind/UV: checks that tabs and metrics adapt.
  - weather:
      - name: Dev weather (daily only)
        unique_id: dev_weather_daily_only
        condition: sunny
        temperature: 24
        temperature_unit: °C
        humidity: 35
        forecast_daily: >-
          {% set start = now().replace(hour=12, minute=0, second=0, microsecond=0) %}
          {% set ns = namespace(items=[]) %}
          {% for i in range(0, 7) %}
            {% set ns.items = ns.items + [{
              "datetime": (start + timedelta(days=i)).isoformat(),
              "temperature": 24 + (i % 3),
              "templow": 12 + (i % 2),
              "condition": 'sunny' if i % 2 == 0 else 'partlycloudy'
            }] %}
          {% endfor %}
          {{ ns.items }}

  # Sensors for the per-entity overrides.
  - sensor:
      - name: Dev outdoor temperature
        unique_id: dev_outdoor_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: °C
        state: "{{ (states('input_number.dev_temperature') | float(18)) + 1.5 }}"
      - name: Dev outdoor humidity
        unique_id: dev_outdoor_humidity
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ (states('input_number.dev_humidity') | float(60)) - 5 }}"
      - name: Dev outdoor wind speed
        unique_id: dev_outdoor_wind
        device_class: wind_speed
        state_class: measurement
        unit_of_measurement: km/h
        state: "{{ (states('input_number.dev_wind') | float(0)) + 8 }}"
      - name: Dev outdoor UV
        unique_id: dev_outdoor_uv
        state_class: measurement
        unit_of_measurement: UV index
        state: "{{ (states('input_number.dev_uv') | float(0)) + 3 }}"
