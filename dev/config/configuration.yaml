# Throwaway Home Assistant used to test the card. Not for production use.
homeassistant:
  name: Forecast dev
  latitude: 40.4168
  longitude: -3.7038
  elevation: 650
  unit_system: metric        # switch to us_customary in Settings → General to test °F / mph / in
  time_zone: Europe/Madrid
  currency: EUR
  country: ES
  packages:
    gallery: !include gallery.yaml   # fixed-condition weather entities for the Gallery view

frontend:
  themes: !include_dir_merge_named themes

# Minimal set of integrations (default_config pulls in far more than needed).
config:
history:
logbook:
recorder:
onboarding:
sun:

# Controls to tweak the fake weather live from the dashboard.
input_select:
  dev_condition:
    name: Condition
    icon: mdi:weather-partly-cloudy
    initial: partlycloudy
    options:
      - clear-night
      - cloudy
      - exceptional
      - fog
      - hail
      - lightning
      - lightning-rainy
      - partlycloudy
      - pouring
      - rainy
      - snowy
      - snowy-rainy
      - sunny
      - windy
      - windy-variant

  # Seasonal decoration. Dashboard cards use `festivity: input_select.dev_festivity`, so this drives them all.
  dev_festivity:
    name: Festivity
    icon: mdi:party-popper
    initial: auto
    options:
      - auto
      - none
      - epiphany
      - valentine
      - carnival
      - fallas
      - easter
      - halloween
      - christmas
      - new_year

# Fake alerts: pick a severity per alert (or off). Several at once test the scrollable list.
  dev_alert_rain:
    name: Alert · Rain
    icon: mdi:weather-pouring
    initial: "off"
    options: ["off", Minor, Moderate, Severe, Extreme]
  dev_alert_wind:
    name: Alert · Wind
    icon: mdi:weather-windy
    initial: "off"
    options: ["off", Minor, Moderate, Severe, Extreme]
  dev_alert_heat:
    name: Alert · Heat wave
    icon: mdi:thermometer-high
    initial: "off"
    options: ["off", Minor, Moderate, Severe, Extreme]
  dev_alert_snow:
    name: Alert · Snow
    icon: mdi:weather-snowy
    initial: "off"
    options: ["off", Minor, Moderate, Severe, Extreme]
  dev_alert_storm:
    name: Alert · Thunderstorms
    icon: mdi:weather-lightning
    initial: "off"
    options: ["off", Minor, Moderate, Severe, Extreme]
  # One alert each for the Meteoalarm-style and custom-adapter entities.
  dev_alert_meteoalarm:
    name: Meteoalarm-style alert
    icon: mdi:alert
    initial: "off"
    options: ["off", Moderate, Severe, Extreme]
  dev_alert_custom:
    name: Custom-adapter alert
    icon: mdi:alert-circle
    initial: "off"
    options: ["off", leve, fuerte]

input_boolean:
  dev_alert_ec:
    name: Environment Canada warning
    icon: mdi:alert-octagon

input_number:
  dev_temperature:
    name: Temperature
    min: -30
    max: 50
    step: 0.5
    initial: 19
    unit_of_measurement: °C
  dev_humidity:
    name: Humidity
    min: 0
    max: 100
    step: 1
    initial: 67
    unit_of_measurement: "%"
  dev_wind:
    name: Wind speed
    min: 0
    max: 150
    step: 1
    initial: 10
    unit_of_measurement: km/h
  dev_wind_bearing:
    name: Wind bearing
    min: 0
    max: 359
    step: 1
    initial: 112
    unit_of_measurement: °
  dev_uv:
    name: UV index
    min: 0
    max: 14
    step: 0.1
    initial: 1.7
  dev_rain:
    name: Rain (mm per rainy slot)
    min: 0
    max: 20
    step: 0.1
    initial: 0.8
    unit_of_measurement: mm

template:
  # Full-featured weather: hourly + daily forecasts driven by the helpers above.
  - weather:
      - name: Dev weather
        unique_id: dev_weather
        condition: "{{ states('input_select.dev_condition') }}"
        temperature: "{{ states('input_number.dev_temperature') | float(18) }}"
        temperature_unit: °C
        humidity: "{{ states('input_number.dev_humidity') | float(60) }}"
        wind_speed: "{{ states('input_number.dev_wind') | float(0) }}"
        wind_speed_unit: km/h
        wind_bearing: "{{ states('input_number.dev_wind_bearing') | float(0) }}"
        uv_index: "{{ states('input_number.dev_uv') | float(0) }}"
        precipitation_unit: mm
        forecast_hourly: >-
          {% set base = states('input_number.dev_temperature') | float(18) %}
          {% set cond = states('input_select.dev_condition') %}
          {% set rain = states('input_number.dev_rain') | float(0) %}
          {% set start = now().replace(minute=0, second=0, microsecond=0) %}
          {% set ns = namespace(items=[]) %}
          {% for i in range(0, 24) %}
            {% set when = start + timedelta(hours=i) %}
            {% set wet = i % 6 in [2, 3] %}
            {% set ns.items = ns.items + [{
              "datetime": when.isoformat(),
              "temperature": (base + 8 * cos((when.hour - 15) * 0.2618)) | round(1),
              "condition": 'rainy' if wet else cond,
              "precipitation": rain if wet else 0,
              "precipitation_probability": 70 if wet else 10,
              "is_daytime": 7 <= when.hour <= 20
            }] %}
          {% endfor %}
          {{ ns.items }}
        forecast_daily: >-
          {% set base = states('input_number.dev_temperature') | float(18) %}
          {% set cond = states('input_select.dev_condition') %}
          {% set rain = states('input_number.dev_rain') | float(0) %}
          {% set start = now().replace(hour=12, minute=0, second=0, microsecond=0) %}
          {% set ns = namespace(items=[]) %}
          {% for i in range(0, 10) %}
            {% set wet = i in [0, 2, 5] %}
            {% set ns.items = ns.items + [{
              "datetime": (start + timedelta(days=i)).isoformat(),
              "temperature": (base + 4 * cos(i * 0.9)) | round(1),
              "templow": (base - 8 + 4 * cos(i * 0.9)) | round(1),
              "condition": 'rainy' if wet else cond,
              "precipitation": (rain * (1 + i % 3)) if wet else 0,
              "precipitation_probability": 80 if wet else 5
            }] %}
          {% endfor %}
          {{ ns.items }}

  # Daily forecast only, no wind/UV: checks that tabs and metrics adapt.
  - weather:
      - name: Dev weather (daily only)
        unique_id: dev_weather_daily_only
        condition: sunny
        temperature: 24
        temperature_unit: °C
        humidity: 35
        forecast_daily: >-
          {% set start = now().replace(hour=12, minute=0, second=0, microsecond=0) %}
          {% set ns = namespace(items=[]) %}
          {% for i in range(0, 7) %}
            {% set ns.items = ns.items + [{
              "datetime": (start + timedelta(days=i)).isoformat(),
              "temperature": 24 + (i % 3),
              "templow": 12 + (i % 2),
              "condition": 'sunny' if i % 2 == 0 else 'partlycloudy'
            }] %}
          {% endfor %}
          {{ ns.items }}

  # Sensors for the per-entity overrides.
  - sensor:
      - name: Dev outdoor temperature
        unique_id: dev_outdoor_temperature
        device_class: temperature
        state_class: measurement
        unit_of_measurement: °C
        state: "{{ (states('input_number.dev_temperature') | float(18)) + 1.5 }}"
      - name: Dev outdoor humidity
        unique_id: dev_outdoor_humidity
        device_class: humidity
        state_class: measurement
        unit_of_measurement: "%"
        state: "{{ (states('input_number.dev_humidity') | float(60)) - 5 }}"
      - name: Dev outdoor wind speed
        unique_id: dev_outdoor_wind
        device_class: wind_speed
        state_class: measurement
        unit_of_measurement: km/h
        state: "{{ (states('input_number.dev_wind') | float(0)) + 8 }}"
      - name: Dev outdoor UV
        unique_id: dev_outdoor_uv
        state_class: measurement
        unit_of_measurement: UV index
        state: "{{ (states('input_number.dev_uv') | float(0)) + 3 }}"

  # ── Fake alert providers (see the "Fake alert controls" card) ──────────────
  # NWS style: state = number of alerts, details in an `alerts` attribute.
  - sensor:
      - name: Dev alerts NWS
        unique_id: dev_alerts_nws
        state: >-
          {{ states.input_select
             | selectattr('entity_id', 'match', 'input_select\\.dev_alert_(rain|wind|heat|snow|storm)$')
             | rejectattr('state', 'eq', 'off') | list | count }}
        attributes:
          alerts: >-
            {% set defs = [
              ('rain', 'Heavy rain', 'Up to 15 mm in 12 hours. Avoid river banks and underpasses.', 6),
              ('wind', 'Strong wind', 'Gusts up to 90 km/h on the coast. Secure loose objects on terraces.', 10),
              ('heat', 'Heat wave', 'Maximum temperatures above 38 °C inland during the afternoon.', 30),
              ('snow', 'Snow', 'Accumulations of 5 cm above 800 m. Chains may be required.', 20),
              ('storm', 'Thunderstorms', 'Hail and intense lightning, locally accompanied by strong gusts.', 4)] %}
            {% set start = now().replace(minute=0, second=0, microsecond=0) %}
            {% set ns = namespace(items=[]) %}
            {% for key, event, text, hours in defs %}
              {% set level = states('input_select.dev_alert_' ~ key) %}
              {% if level not in ['off', 'unknown', 'unavailable'] %}
                {% set ns.items = ns.items + [{
                  "Event": event,
                  "Severity": level,
                  "Headline": event ~ ' issued',
                  "Description": text,
                  "Onset": (start + timedelta(hours=loop.index0)).isoformat(),
                  "Expires": (start + timedelta(hours=hours)).isoformat()
                }] %}
              {% endif %}
            {% endfor %}
            {{ ns.items }}

      # Environment Canada style: `*_warnings` sensor, level comes from the sensor type.
      - name: Dev home warnings
        unique_id: dev_home_warnings
        state: "{{ 1 if is_state('input_boolean.dev_alert_ec', 'on') else 0 }}"
        attributes:
          alerts: >-
            {{ [{"title": "Yellow Warning - Rainfall", "date": now().isoformat()}]
               if is_state('input_boolean.dev_alert_ec', 'on') else [] }}

      # Custom adapter: own attribute names and level words.
      - name: Dev custom alert
        unique_id: dev_custom_alert
        state: "{{ states('input_select.dev_alert_custom') }}"
        attributes:
          nivel: "{{ states('input_select.dev_alert_custom') }}"
          titulo: Ola de calor
          fin: "{{ (now() + timedelta(hours=30)).isoformat() }}"

  # Meteoalarm style: one binary sensor with the alert in its attributes.
  - binary_sensor:
      - name: Dev meteoalarm
        unique_id: dev_meteoalarm
        state: "{{ not is_state('input_select.dev_alert_meteoalarm', 'off') }}"
        attributes:
          attribution: Information provided by MeteoAlarm
          event: Heavy rain
          headline: Heavy rain expected in the metropolitan area
          severity: "{{ states('input_select.dev_alert_meteoalarm') }}"
          awareness_level: >-
            {{ {'Moderate': '2; yellow; Moderate', 'Severe': '3; orange; Severe', 'Extreme': '4; red; Extreme'}
               .get(states('input_select.dev_alert_meteoalarm'), '1; green; Minor') }}
          onset: "{{ now().replace(minute=0, second=0, microsecond=0).isoformat() }}"
          expires: "{{ now().replace(hour=23, minute=59, second=0, microsecond=0).isoformat() }}"
